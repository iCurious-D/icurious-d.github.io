<article class="homepage-card">
    <a class="homepage-card__link" href="{{ .RelPermalink }}" aria-label="{{ .Title }}"></a>
    <div class="homepage-card__content">
        <div class="homepage-card__header">
            <span class="homepage-card__tag homepage-card__tag--{{ if eq .Section "projects" }}project{{ else if eq .Section "leetcode" }}leetcode{{ else }}article{{ end }}">
                {{ if eq .Section "projects" }}项目{{ else if eq .Section "leetcode" }}题解{{ else }}文章{{ end }}
            </span>
            <h2 class="homepage-card__title">
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </h2>
        </div>

        {{ with .Params.description }}
        <p class="homepage-card__desc">{{ . }}</p>
        {{ end }}

        <div class="homepage-card__meta">
            <span class="homepage-card__meta-item">
                {{ partial "helper/icon" "date" }}
                <time datetime='{{ .Date.Format "2006-01-02T15:04:05-07:00" }}'>
                    {{ .Date.Format "Jan 02, 2006" }}
                </time>
            </span>
        </div>
    </div>
</article>
