# hugo.yaml
baseURL: https://icurious-d.github.io/  # CI 部署时会被 GitHub Actions 自动覆盖
defaultContentLanguage: zh-cn      # 默认语言，加载主题 i18n/zh-cn.yaml
defaultContentLanguageInSubdir: false
languages:
  zh-cn:
    label: 简体中文
    locale: zh-CN
    weight: 1
enableRobotsTXT: true
title: "gugugu｜AI 应用工程师"
# theme: hugo-theme-stack      # 主题名称，与模块名一致

# 首页文章列表的设置
pagination:
  pagerSize: 10    # Hugo 新版分页配置：每页 10 篇（tools 6 个工具单页展示）
# 注意：不要禁用 taxonomy —— 文章卡片和右侧栏的分类/标签链接依赖
# /categories/ 与 /tags/ 页面，禁用后这些链接会全部 404

# LeetCode 文章已迁移至独立 section（content/leetcode/），
# 用 permalinks 保持历史 URL 不变，避免外链与搜索引擎索引失效
permalinks:
  # :contentbasename 保持与旧目录结构一致的 URL（/posts/leetcode_stories/26-10-02/）
  leetcode: /posts/leetcode_stories/:contentbasename/

# 模块配置：指定主题的git仓库地址
module:
    imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v3

# 菜单配置：定义导航栏的项目
menu:
    main:
    - identifier: "home"
      name: "主页"
      url: "/"
      weight: 10
      params:
        icon: "home"
    - identifier: "projects"
      name: "项目"
      url: "/projects/"
      weight: 15
      params:
        icon: "tools"         # 项目图标
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 20
      params:
        icon: "article"       # 文章图标
    - identifier: "leetcode"
      name: "刷题"
      url: "/leetcode/"
      weight: 22
      params:
        icon: "code"          # 刷题图标
    - identifier: "tools"
      name: "工具"
      url: "/tools"
      weight: 25
      params:
        icon: "tools"
    - identifier: "about"
      name: "关于我"
      url: "/about/"
      weight: 30
      params:
        icon: "user"          # 用户图标


params:
  favicon: /favicon.svg   # 网站图标（emoji SVG）
  description: "AI 应用工程师作品集与技术博客，聚焦 RAG、Agent、LLM 评测和服务工程化。"
  author:
    name: "gugugu"
  featuredImageField: image
  opengraph:
    twitter:
      card: summary_large_image
  defaultImage:
    opengraph:
      enabled: true
      local: true
      src: img/avatar.jpg

  # 侧边栏配置
  sidebar:
    emoji: "✏️"
    subtitle: "RAG / Agent / LLM Engineering"
    avatar:
      src: "img/avatar.jpg"          # 头像路径 (稍后会解释如何放置)
      # srcDark 用于暗色模式，可选用另一张图，可以不设置
      # srcDark: "img/avatar-dark.png"
      alt: "gugugu的头像"             # 图片描述

  # 首页显示的内容板块（顺序决定排列优先级）
  mainSections:
    - projects
    - posts

  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: iCurious-D/icurious-d.github.io
      repoID: R_kgDOSu3GEQ
      category: General
      categoryID: DIC_kwDOSu3GEc4C-u1E
      mapping: pathname
      reactionsEnabled: 1        # 注意这里不要加引号，用数字
      emitMetadata: 0
      inputPosition: bottom
      lang: zh-CN
      lightTheme: light
      darkTheme: dark
#      loading: lazy
  #    enabled: true
#    provider: utterances
#    utterances:
#      repo: iCurious-D/myblog
#      issueTerm: pathname
#      label: comment
#      theme: preferred-color-scheme

  # 侧边栏配置
  widgets:
    homepage:
      - type: search
      - type: categories
        params:
          limit: 5
      - type: tag-cloud
        params:
          limit: 15
    page:
      - type: toc
    # 可选：也可以为文章页单独配置
    # post:
    #   - type: toc
    #   - type: related-posts

markup:
  goldmark:
    renderer:
      unsafe: true
