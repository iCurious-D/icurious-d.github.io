# hugo.yaml
baseURL: http://icurious-d.github.io/  # CI 部署时会被 GitHub Actions 自动覆盖，无需手动修改
defaultContentLanguage: zh-cn      # 默认语言，加载主题 i18n/zh-cn.yaml
defaultContentLanguageInSubdir: false
title: gugugu           # 网站标题
# theme: hugo-theme-stack      # 主题名称，与模块名一致

# 首页文章列表的设置
#paginate: 5                  # 每页显示5篇文章
pagination:
  pagerSize: 5
# 禁用普通分类，仅使用标签
disableKinds: ["taxonomy"]

# 模块配置：指定主题的git仓库地址
module:
    imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v3

# 菜单配置：定义导航栏的项目
menu:
    main:
    - identifier: "home"
      name: "主页"
      url: "/"
      weight: 10
      params:
        icon: "home"
    - identifier: "projects"
      name: "项目"
      url: "/projects/"
      weight: 15
      params:
        icon: "tools"         # 项目图标
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 20
      params:
        icon: "article"       # 文章图标
    - identifier: "tools"
      name: "工具"
      url: "/tools"
      weight: 25
      params:
        icon: "tools"
    - identifier: "kids"
      name: "趣学"
      url: "/kids/"
      weight: 28
      params:
        icon: "notes"
    - identifier: "about"
      name: "关于我"
      url: "/about/"
      weight: 30
      params:
        icon: "user"          # 用户图标

    # 社交链接配置(数组格式)
    social:
    - identifier: "github"
      name: "GitHub"
      url: "https://github.com/iCurious-D"   # 自己的 GitHub 链接
      params:
        icon: "brand-github"

params:
  favicon: /favicon.svg   # 网站图标（emoji SVG）

  # 侧边栏配置 (这是重点)
  sidebar:
    emoji: "✏️"
    subtitle: "AI Engineer / AIGC Builder"  # 头像下方的个人签名
    avatar:
      src: "img/avatar.jpg"          # 头像路径 (稍后会解释如何放置)
      # srcDark 用于暗色模式，可选用另一张图，可以不设置
      # srcDark: "img/avatar-dark.png"
      alt: "gugugu的头像"             # 图片描述

  # 首页显示的内容板块（顺序决定排列优先级）
  mainSections:
    - projects
    - posts

  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: iCurious-D/icurious-d.github.io
      repoID: R_kgDOSu3GEQ
      category: General
      categoryID: DIC_kwDOSu3GEc4C-u1E
      mapping: pathname
      reactionsEnabled: 1        # 注意这里不要加引号，用数字
      emitMetadata: 0
      inputPosition: bottom
      lang: zh-CN
      lightTheme: light
      darkTheme: dark
#      loading: lazy
  #    enabled: true
#    provider: utterances
#    utterances:
#      repo: iCurious-D/myblog
#      issueTerm: pathname
#      label: comment
#      theme: preferred-color-scheme

  # 侧边栏配置
  widgets:
    homepage:
      - type: search
      - type: categories
        params:
          limit: 5
      - type: tag-cloud
        params:
          limit: 15
    page:
      - type: toc
    # 可选：也可以为文章页单独配置
    # post:
    #   - type: toc
    #   - type: related-posts

markup:
  goldmark:
    renderer:
      unsafe: true
